name: "Jackson Kotlin"
description: >
  Auto-registers Kotlin data classes, enums, and Jackson-annotated classes for native-image
  reflection so the Jackson Kotlin module works in Quarkus native binaries without
  hand-curated @RegisterForReflection lists.
